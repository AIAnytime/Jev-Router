[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-router"
version = "0.1.0"
description = "Decision-first, OpenAI-compatible AI router powered by Jev: routes every request to the right LLM, agent or tool with typed, explainable decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Anytime" }]
keywords = ["llm", "router", "ai-gateway", "openai", "jev", "typesafe", "llm-routing", "fastapi"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "openai>=1.40"]

[project.scripts]
jev-router = "jev_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
